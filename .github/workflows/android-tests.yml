name: Android unit tests

# Fast feedback loop for pull requests: JVM/Robolectric unit tests, lint report and
# coverage report without the NDK/llama.cpp release build. The heavy APK pipeline
# (.github/workflows/build-android-apk.yml) runs only after merge to main.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests, lint and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Robolectric 4.16 running tests against Android SDK 36 requires Java 21.
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 build platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests, lint and coverage report
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug createDebugUnitTestCoverageReport > gradle-test.log 2>&1
          code=$?
          cat gradle-test.log
          if [ $code -ne 0 ]; then
            {
              grep -E '^e: ' gradle-test.log
              awk '/\* What went wrong:/{keep=1} /\* Try:/{keep=0} keep' gradle-test.log
              python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(f).getroot()
              for tc in root.iter('testcase'):
                  for child in tc:
                      if child.tag in ('failure', 'error'):
                          msg = (child.get('message') or child.text or '')[:400].replace('\n', ' ')
                          print(f"FAILED {tc.get('classname')}.{tc.get('name')}: {msg}")
          PY
            } > gradle-tail.txt
            if [ ! -s gradle-tail.txt ]; then tail -c 2500 gradle-test.log > gradle-tail.txt; fi
            head -c 3000 gradle-tail.txt | tr '\n' '\001' | sed 's/\r//g; s/%/%25/g; s/\001/%0A/g' > gradle-annotation.txt
            echo "::error title=Unit test step failed::$(cat gradle-annotation.txt)"
            exit $code
          fi

      - name: Upload test, lint and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-reports
          path: |
            app/build/reports/tests
            app/build/reports/coverage-tests
            app/build/reports/lint-results*
            app/build/test-results
          if-no-files-found: warn
          retention-days: 14
