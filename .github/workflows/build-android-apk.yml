name: Android APK

on:
  push:
    branches:
      - arena/eef3a96d-salvia-offline-ai
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Robolectric 4.16 running tests against Android SDK 36 requires Java 21.
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 build platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace testDebugUnitTest > gradle-test.log 2>&1
          code=$?
          cat gradle-test.log
          if [ $code -ne 0 ]; then
            {
              grep -E '^e: ' gradle-test.log
              awk '/\* What went wrong:/{keep=1} /\* Try:/{keep=0} keep' gradle-test.log
              python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(f).getroot()
              for tc in root.iter('testcase'):
                  for child in tc:
                      if child.tag in ('failure', 'error'):
                          msg = (child.get('message') or child.text or '')[:400].replace('\n', ' ')
                          print(f"FAILED {tc.get('classname')}.{tc.get('name')}: {msg}")
          PY
            } > gradle-tail.txt
            if [ ! -s gradle-tail.txt ]; then tail -c 2500 gradle-test.log > gradle-tail.txt; fi
            head -c 3000 gradle-tail.txt | tr '\n' '\001' | sed 's/\r//g; s/%/%25/g; s/\001/%0A/g' > gradle-annotation.txt
            echo "::error title=Unit test step failed::$(cat gradle-annotation.txt)"
            exit $code
          fi

      - name: Build installable APK
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug > gradle-assemble.log 2>&1
          code=$?
          cat gradle-assemble.log
          if [ $code -ne 0 ]; then
            { grep -E '^e: ' gradle-assemble.log; awk '/\* What went wrong:/{keep=1} /\* Try:/{keep=0} keep' gradle-assemble.log; } > gradle-tail.txt
            if [ ! -s gradle-tail.txt ]; then tail -c 2500 gradle-assemble.log > gradle-tail.txt; fi
            head -c 3000 gradle-tail.txt | tr '\n' '\001' | sed 's/\r//g; s/%/%25/g; s/\001/%0A/g' > gradle-annotation.txt
            echo "::error title=APK build step failed::$(cat gradle-annotation.txt)"
            exit $code
          fi

      - name: Verify APK and create checksum
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Salvia-offline-AI-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
